
services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: churn_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: churn_app
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: churn_network
